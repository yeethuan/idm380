        <form id="contact" action="homework4.html" method="post" aria-describedby="form-desc">
            <fieldset class="field-layout">
            <fieldset class="field-row" aria-labelledby="full-name">
                <legend class="sr-only">Full name</legend>
                <fieldset>
                    <label for="fname">First name <span class="req-star" aria-hidden="true">*</span></label>
                    <input type="text" id="fname" name="fname" placeholder="Jane" autocomplete="given-name" required aria-required="true"
                        aria-describedby="fname-hint">
                    <span class="hint" id="fname-hint">Your preferred alias.</span>
                </fieldset>

                <fieldset>
                    <label for="lname">Last name</label>
                    <input type="text" id="lname" name="lname" placeholder="Smith" autocomplete="family-name">
                </fieldset>
            </fieldset>


            <fieldset>
                <label for="email" aria-labelledby="email"> Email address <span class="req-star" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" inputmode="email" required aria-required="true" aria-describedby="email-hint">     
            </fieldset>


            <fieldset>
                <label for="birthdaytime">Birthday</label>
                <input type="datetime-local" id="birthdaytime" name="birthdaytime" autocomplete="bday" aria-describedby="bday-hint">
            </fieldset>
            
            <fieldset> 
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help you?" rows="5" aria-describedby="message-hint"></textarea>
                <span class="hint" id="message-hint">Maximum 1000 characters.</span>
            </fieldset>


      <fieldset class="action">
            <legend>Form actions</legend>
            <fieldset class="actions">
            <input type="submit" id="contact-submit" value="Send Message" aria-describedby="form-status">
            <input type="reset" value="Clear form" aria-label="Clear all fields and start over">
            </fieldset>
      </fieldset>
      <p id="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
    
    </fieldset>
    </form>
