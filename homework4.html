<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style4.css"> 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Contact</title>
</head>

<body>
    <a href="#MainContent" class="skip-link" id="skip-link">Skip to main content</a>

    <header id="header" tabindex="0">
        <nav aria-label="Main Navigation" id="myTopnav">
            <a href="homework4.html" class="logo" id="logo">
                <img src="media/olly-logo.webp" alt="Olly">
            </a>

            <ul class="nav-links" aria-label="nav-links">
                <li aria-label="nav-link1"><a href="#void">Supplements</a></li>
                <li aria-label="nav-link2"><a href="#void">Physical</a></li>
                <li aria-label="nav-link3"><a href="#void">Rewards</a></li>
                <li aria-label="nav-link4"><a href="#void">Blog</a></li>
                <li aria-label="nav-link5"><a href="#homework4.html" aria-current="page">Contact</a></li>
                <li aria-label="nav-link6"><a href="#void">Mission</a></li>
            </ul>
        </nav>
    </header>

    <main id="MainContent" tabindex="-1">
        <h4>Contact Us!</h4>
        <form id="contact" action="homework4.html" method="post" aria-describedby="form-description">
            <fieldset class="field-layout">
                <fieldset class="field-row" aria-labelledby="full-name">
                    <legend class="sr-only">Full name</legend>
                    <fieldset aria-labelledby="first-name">
                        <label for="fname">First name <span class="req-star" aria-hidden="true">*</span></label>
                        <input type="text" id="fname" name="fname" placeholder="Jane" autocomplete="given-name" required aria-required="true"
                            aria-describedby="fname-hint">
                        <span class="hint" id="fname-hint">Your preferred alias.</span>
                    </fieldset>

                    <fieldset aria-labelledby="last-name">
                        <label for="lname">Last name</label>
                        <input type="text" id="lname" name="lname" placeholder="Smith" autocomplete="family-name">
                    </fieldset>
            </fieldset>


            <fieldset aria-labelledby="email-address">
                <label for="email" aria-labelledby="email-address"> Email address <span class="req-star" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" inputmode="email" required aria-required="true" aria-labelledby="email-address">     
            </fieldset>


            <fieldset aria-labelledby="birthday">
                <label for="birthdaytime" aria-labelledby="birthday">Birthday</label>
                <input type="date" id="birthday" name="birthday" autocomplete="bday" aria-describedby="bday-hint" >
            </fieldset>
            
            <fieldset> 
                <label for="message" aria-labelledby="your-message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help you?" rows="5" aria-describedby="message-hint"></textarea>
                <span class="hint" id="message-hint">Maximum 1000 characters.</span>
            </fieldset>


      <fieldset class="action" aria-labelledby="form-actions">
            <!-- <legend>Form actions</legend> -->
            <fieldset class="actions" aria-labelledby="form-buttons">
                <input type="submit" id="contact-submit" value="Send Message" aria-describedby="form-status">
                <input type="reset" value="Clear form" aria-label="Clear all fields and start over">
            </fieldset>
      </fieldset>
      <p id="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
    
    </fieldset>
    </form>
    </main>


    <section class="skip-to-top" aria-labelledby="skip-to-top">
        <a href="#skip-link" class="skip-back-to-top" aria-labelledby="skip-to-top-link">
            <button class="skip-backtotop" aria-labelledby="skip-to-top" >
                Back to top
                <span aria-hidden="true">↑</span>
            </button>
        </a>
    </section>

    <script>
        $(document).ready(function() {
            $('#contact').on('submit', function(e) {
                e.preventDefault(); // stops the page from reloading

                swal("Message Sent!", "Thanks for reaching out. We'll get back to you soon.", "success", {
                    button: "Ok",
                });

            this.reset(); // optionally clear the form after submission
            });
        });
    </script>


    <footer>
        <nav aria-label="Footer-navigation">
            <ul aria-label="nav-links">
            <li aria-label="nav-link1"><a href="homework4.html">Contact</a></li>
            <li aria-label="nav-link2"><a href="#void">Store Locator</a></li>
            <li aria-label="nav-link3"><a href="#void">Careers</a></li>
            <li aria-label="nav-link4"><a href="#void">Help Center</a></li>
            </ul>
        </nav>

        <nav aria-label="Social-links">
            <ul aria-label="social-links">
            <li aria-label="social-link1"><a href="#void">Instagram</a></li>
            <li aria-label="social-link2"><a href="#void">Facebook</a></li>
            <li aria-label="social-link3"><a href="#void">Certified B Corp</a></li>
            </ul>
        </nav>
</footer>

</body>

</html>
